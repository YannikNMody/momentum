<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Momentum Lite</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="background" class="background" aria-hidden="true">
    <img id="background-image" class="background-image" alt="" />
    <div class="background-overlay"></div>
  </div>
  <section id="weather-widget" class="weather-widget distraction-hide">
    <button id="weather-toggle" class="weather-toggle" type="button" aria-expanded="false" aria-controls="weather-panel">
      <span id="weather-icon" class="weather-icon"></span>
      <span id="weather-temp" class="weather-temp"></span>
      <span id="weather-city" class="weather-city"></span>
    </button>
    <div id="weather-search" class="weather-search" hidden>
      <input id="weather-search-input" class="weather-search-input" type="text" placeholder="Search city" autocomplete="off" />
      <ul id="weather-search-results" class="weather-search-results"></ul>
    </div>
    <div id="weather-panel" class="weather-panel" hidden>
      <p id="weather-condition" class="weather-condition"></p>
      <p id="weather-feels-like" class="weather-feels-like"></p>
      <p id="weather-highlow" class="weather-highlow"></p>
      <ul id="weather-hourly" class="weather-hourly"></ul>
      <p id="weather-updated" class="weather-updated"></p>
    </div>
  </section>

  <div class="corner-controls">
    <button id="distraction-toggle" class="distraction-toggle" type="button" title="Toggle distraction-free view (F)" aria-pressed="false">Focus view</button>
    <button id="settings-toggle" class="settings-toggle" type="button" aria-haspopup="dialog" aria-controls="settings-sheet" aria-expanded="false" title="Settings">
      <span class="visually-hidden">Settings</span>
    </button>
    <button id="background-next" class="background-next distraction-hide" type="button" title="Next background image">Next photo</button>
  </div>
  <p id="background-credit" class="background-credit distraction-hide"></p>

  <div id="settings-overlay" class="settings-overlay" hidden></div>
  <div id="settings-sheet" class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="settings-header">
      <h2 id="settings-title">Settings</h2>
      <button id="settings-close" class="settings-close" type="button" aria-label="Close settings">Close</button>
    </div>

    <section class="settings-section">
      <h3>General</h3>
      <label class="settings-label" for="settings-name-input">Your name</label>
      <input id="settings-name-input" class="settings-input" type="text" autocomplete="off" />
    </section>

    <section class="settings-section">
      <h3>Background</h3>
      <label class="settings-label" for="settings-background-source">Background source</label>
      <select id="settings-background-source" class="settings-select">
        <option value="bundled">Football photos</option>
        <option value="custom">My photos</option>
        <option value="both">Both</option>
      </select>

      <div id="settings-dropzone" class="settings-dropzone">
        <p>Drag photos here, or</p>
        <label class="settings-file-label" for="settings-file-input">Choose files</label>
        <input id="settings-file-input" class="settings-file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
      </div>
      <p id="settings-upload-message" class="settings-upload-message" role="status"></p>
      <p id="settings-storage-usage" class="settings-storage-usage"></p>

      <ul id="settings-gallery" class="settings-gallery"></ul>
    </section>

    <section class="settings-section">
      <h3>Weather</h3>
      <label class="settings-label" for="settings-weather-city-input">City</label>
      <input id="settings-weather-city-input" class="settings-input" type="text" placeholder="Search city" autocomplete="off" />
      <ul id="settings-weather-results" class="settings-weather-results"></ul>
      <p id="settings-weather-current" class="settings-weather-current"></p>
      <div class="settings-unit-toggle" role="radiogroup" aria-label="Temperature units">
        <button id="settings-unit-c" class="settings-unit-btn" type="button" role="radio">°C</button>
        <button id="settings-unit-f" class="settings-unit-btn" type="button" role="radio">°F</button>
      </div>
    </section>

    <section class="settings-section">
      <h3>NFL</h3>
      <label class="settings-label" for="settings-nfl-favorite">Favorite team</label>
      <select id="settings-nfl-favorite" class="settings-select"></select>
    </section>

    <section class="settings-section">
      <h3>Focus</h3>
      <label class="settings-label" for="settings-focus-minutes">Focus length (minutes)</label>
      <input id="settings-focus-minutes" class="settings-input settings-input-number" type="number" min="1" max="180" />
      <label class="settings-label" for="settings-break-minutes">Break length (minutes)</label>
      <input id="settings-break-minutes" class="settings-input settings-input-number" type="number" min="1" max="60" />
    </section>
  </div>

  <main class="container">
    <p id="greeting" class="greeting"></p>
    <h1 id="clock" class="clock"></h1>
    <p id="date" class="date"></p>

    <section id="focus-section" class="focus-section">
      <form id="focus-form" class="focus-form">
        <input id="focus-input" class="focus-input" type="text" placeholder="What's your main focus today?" autocomplete="off" />
      </form>
      <div id="focus-display" class="focus-display" hidden>
        <input id="focus-checkbox" class="focus-checkbox" type="checkbox" />
        <span id="focus-text" class="focus-text"></span>
        <button id="focus-edit-btn" class="focus-edit-btn distraction-hide" type="button">Edit</button>
        <button id="focus-clear-btn" class="focus-clear-btn distraction-hide" type="button">Clear</button>
      </div>
    </section>

    <section id="timer-section" class="timer-section">
      <div id="timer-mode" class="timer-mode"></div>
      <div id="timer-display" class="timer-display"></div>
      <div class="timer-controls">
        <button id="timer-start" class="timer-btn" type="button">Start</button>
        <button id="timer-pause" class="timer-btn" type="button" hidden>Pause</button>
        <button id="timer-resume" class="timer-btn" type="button" hidden>Resume</button>
        <button id="timer-reset" class="timer-btn" type="button">Reset</button>
        <button id="timer-skip" class="timer-btn" type="button">Skip to break</button>
      </div>
      <div id="timer-banner" class="timer-banner" hidden>
        <span id="timer-banner-text" class="timer-banner-text"></span>
        <button id="timer-dismiss" class="timer-dismiss" type="button">Dismiss</button>
      </div>
    </section>
  </main>

  <section id="todo-panel" class="todo-panel distraction-hide">
    <button id="todo-toggle" class="todo-toggle" type="button" aria-expanded="true" aria-controls="todo-body">
      <span>Todos</span>
      <span id="todo-count" class="todo-count"></span>
    </button>
    <div id="todo-body" class="todo-body">
      <form id="todo-form" class="todo-form">
        <input id="todo-input" class="todo-input" type="text" placeholder="Add a todo and press Enter" autocomplete="off" />
      </form>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-empty" class="todo-empty">No todos yet.</p>
    </div>
  </section>

  <section id="nfl-panel" class="nfl-panel distraction-hide" hidden>
    <button id="nfl-toggle" class="nfl-toggle" type="button" aria-expanded="true" aria-controls="nfl-body">
      <span id="nfl-title">NFL</span>
    </button>
    <div id="nfl-body" class="nfl-body">
      <ul id="nfl-game-list" class="nfl-game-list"></ul>
      <p id="nfl-updated" class="nfl-updated"></p>
    </div>
  </section>

  <script type="module" src="newtab.js"></script>
</body>
</html>
